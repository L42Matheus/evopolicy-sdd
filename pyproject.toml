[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evopolicy-sdd"
version = "0.3.0"
description = "Protótipo de coevolução e rastreabilidade de políticas e regras em agentes com RAG"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
# Camada de LLM (L4, agente e baseline). O núcleo continua sem dependência de LLM.
llm = ["anthropic>=2.8,<3", "openai>=2.54,<3"]

[project.scripts]
evopolicy = "evopolicy.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
