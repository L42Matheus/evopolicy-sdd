study: EvoPolicy-SDD
version: '1'
effective_date: '2026-11-10'
scope: Plataforma fictícia de pedidos, sem dados reais
fields:
  fraude_suspeita: bool
  falha_origem: str
  cancelamento_cliente: bool
  despachado: bool
  cliente_premium: bool
  horas_apos_despacho: number
requirements:
- id: REQ-01
  description: Casos de fraude suspeita exigem avaliação humana antes de qualquer reembolso.
  acceptance_criterion: Se fraude_suspeita=true, decisão REVISAO_HUMANA independentemente das outras condições.
- id: REQ-02
  description: Falhas atribuídas a restaurante ou transportadora podem gerar reembolso.
  acceptance_criterion: Se falha_origem in [restaurante,transportadora] e não há fraude, decisão PERMITIR.
- id: REQ-03
  description: Cancelamentos solicitados pelo cliente após o despacho são normalmente negados.
  acceptance_criterion: 'Cliente cancelou após despacho, sem exceção aplicável: NEGAR.'
- id: REQ-04
  description: Cancelamento solicitado antes do despacho é permitido.
  acceptance_criterion: 'Cliente cancelou antes do despacho, sem fraude/falha prioritária: PERMITIR.'
rules:
- id: REG-SEG
  priority: 10
  document_id: DOC-SEG
  requirement_ids:
  - REQ-01
  when:
    all:
    - field: fraude_suspeita
      op: eq
      value: true
  decision: REVISAO_HUMANA
  rationale: 'Sinal de fraude: encaminhar para revisão humana.'
- id: REG-FALHA
  priority: 20
  document_id: DOC-FALHA
  requirement_ids:
  - REQ-02
  when:
    all:
    - field: falha_origem
      op: in
      value:
      - restaurante
      - transportadora
  decision: PERMITIR
  rationale: 'Falha operacional identificada: reembolso elegível.'
- id: REG-CANCEL-ENVIADO
  priority: 30
  document_id: DOC-CANCEL
  requirement_ids:
  - REQ-03
  when:
    all:
    - field: cancelamento_cliente
      op: eq
      value: true
    - field: despachado
      op: eq
      value: true
  decision: NEGAR
  rationale: Cancelamento após despacho sem exceção aplicável.
- id: REG-CANCEL-PRE
  priority: 40
  document_id: DOC-CANCEL
  requirement_ids:
  - REQ-04
  when:
    all:
    - field: cancelamento_cliente
      op: eq
      value: true
    - field: despachado
      op: eq
      value: false
  decision: PERMITIR
  rationale: Cancelamento antes do despacho.
default_decision: REVISAO_HUMANA
